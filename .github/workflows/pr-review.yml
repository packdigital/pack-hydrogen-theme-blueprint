name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

jobs:
  review:
    # Review once, when the PR is ready: opening as a draft fires `opened`, and
    # marking it ready later fires `ready_for_review`, so the draft guard keeps
    # it to a single run. To re-review after new pushes, add the `claude-review`
    # label (remove and re-add it for later rounds).
    if: >
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    # Job-level so unrelated label events, which skip this job, don't cancel a
    # review already in progress.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The Claude App token from the OIDC exchange only carries these scopes
          # if requested here AND granted in the job-level permissions block above.
          additional_permissions: |
            checks: read
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Follow CLAUDE.md, including its repository invariants for Hydrogen,
            React Router, and Pack CMS sections. Review the complete PR diff with
            `gh pr diff`. Inspect surrounding code, call sites, and every usage of
            a changed shared component or hook in the checkout before judging each
            changed path. Use `gh pr view` for stated intent and `gh pr checks` for
            CI and deployment status. Skip lockfiles, generated files
            (`storefrontapi.generated.d.ts`, `*.tsbuildinfo`), and build output.

            Report every discrete, actionable issue introduced by this PR that
            could cause incorrect behavior, a security vulnerability, a material
            performance regression (uncached queries, extra client-side requests,
            layout shift, hydration mismatches), an accessibility failure against
            WCAG 2.1 AA, a Customizer crash from a schema change, or a clear
            violation of a CLAUDE.md invariant. Check desktop and mobile paths for
            UI changes. Include low-severity bugs and continue through the entire
            diff. Omit pre-existing problems, speculative concerns without a
            demonstrable affected path, intentional behavior changes, and pure
            style or naming preferences.

            Where code parses, transforms, or reconstructs data (CMS content,
            Storefront API responses, cart lines, URL params), work out what the
            output drops that callers need and what it keeps that it must not,
            then trace one maximally-featured input through the new path
            (optional fields, empty CMS groups, missing images, many variants,
            a non-default locale). Where a change repeats across call sites or
            requires a companion edit elsewhere (section registration, schema
            defaults, types, both desktop and mobile variants), enumerate the full
            set and look for the one left behind.

            For each finding, state the triggering scenario, impact, and fix
            direction in one concise paragraph, citing the code that proves it.

            Post one inline comment per issue with
            `mcp__github_inline_comment__create_inline_comment`, `confirmed: true`,
            and the smallest changed line range that shows the problem. Prefix it
            with `[P0]` for a release blocker, `[P1]` for a high-impact issue that
            should be fixed before merge, `[P2]` for an ordinary defect, or `[P3]`
            for a low-impact but concrete defect. On a re-review, first list
            existing inline comments with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            and don't post an issue a previous review already raised.

            Finally, post exactly one short top-level summary with
            `gh pr comment --edit-last --create-if-none`: give finding counts by
            priority and identify any cart or checkout, customer account or auth,
            analytics or tracking, Pack schema, SEO or routing, third-party script,
            or environment variable changes that require careful human review. If
            there are no findings or risk areas, say only
            `No actionable issues found.` Do not repeat inline findings, add praise
            or checklists, approve or block the PR, or modify files. Only GitHub
            comments are visible to the user.

          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Read,Grep,Glob,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments)"
